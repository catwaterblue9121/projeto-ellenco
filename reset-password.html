<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha - EllencoCheck</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
<div class="bg-white rounded-2xl shadow p-8 w-full max-w-md">
<h1 class="text-2xl font-bold text-[#113A6E] mb-6">Criar nova senha</h1>
<form id="form"><input id="senha" type="password" minlength="6" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Nova senha">
<input id="confirmar" type="password" minlength="6" required class="w-full border rounded-lg px-4 py-3 mb-4" placeholder="Confirme a senha">
<button class="w-full bg-[#113A6E] text-white rounded-lg py-3 font-bold">Redefinir senha</button></form>
<p id="msg" class="mt-4 text-sm"></p>
</div>
<script>
const token=new URLSearchParams(location.search).get("token");
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault(); const msg=document.getElementById("msg");
 if(!token) {msg.textContent="Token não informado.";msg.className="mt-4 text-sm text-red-600";return;}
 if(senha.value!==confirmar.value){msg.textContent="As senhas não coincidem.";msg.className="mt-4 text-sm text-red-600";return;}
 const r=await fetch("/api/password/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newPassword:senha.value})});
 const d=await r.json(); msg.textContent=d.mensagem||d.erro||"Erro.";
 msg.className="mt-4 text-sm "+(r.ok?"text-emerald-600":"text-red-600");
 if(r.ok)setTimeout(()=>location.href="./loginecadastro.html",1500);
});
</script></body></html>
